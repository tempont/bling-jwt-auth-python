[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "bling-jwt-auth"
dynamic = ["version"]
description = "OAuth 2.0 / JWT authentication helpers for the Bling API v3"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
authors = [{ name = "tempont" }]
keywords = ["bling", "oauth2", "jwt", "authentication", "erp", "api"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/tempont/bling-jwt-auth-python"
Documentation = "https://github.com/tempont/bling-jwt-auth-python#readme"
Repository = "https://github.com/tempont/bling-jwt-auth-python"
Issues = "https://github.com/tempont/bling-jwt-auth-python/issues"

[project.optional-dependencies]
dev = [
    "basedpyright>=1.0.0",
    "pre-commit>=4.0.0",
    "pytest>=8.0.0",
    "pytest-httpx>=0.30.0",
    "ruff>=0.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bling_jwt_auth"]

[tool.hatch.version]
path = "src/bling_jwt_auth/__init__.py"

[tool.hatch.build.targets.sdist]
include = [
    "/.env.example",
    "/docs",
    "/scripts",
    "/src",
    "/tests",
    "/examples",
    "/README.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100
indent-width = 4
exclude = [".git", ".ruff_cache", ".venv"]
show-fixes = true

[tool.ruff.format]
indent-style = "space"
line-ending = "lf"
quote-style = "double"
docstring-code-format = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "YTT",
    "CPY",
    "FA",
    "TD",
    "C90",
    "PGH",
    "COM812",
    "COM819",
    "D206",
    "D300",
    "E111",
    "E114",
    "E117",
    "E501",
    "Q000",
    "Q001",
    "Q002",
    "Q003",
    "W191",
]
task-tags = ["TODO", "FIXME", "XXX", "HACK"]

[tool.ruff.lint.per-file-ignores]
"examples/**" = ["T201"]
"tests/**" = [
    "ANN001",
    "ANN201",
    "PLR2004",
    "S101",
    "S105",
    "S106",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
failOnWarnings = true
venvPath = "."
venv = ".venv"
extraPaths = ["src"]
exclude = [
    "**/.venv",
    ".venv",
]

[dependency-groups]
dev = [
    "build>=1.5.0",
    "twine>=6.2.0",
]
